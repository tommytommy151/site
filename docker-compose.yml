services:
  app:
    image: ${APP_IMAGE:-lucent-commerce-app}
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - postgres
    expose:
      - "3000"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lucent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lucent_commerce}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
    expose:
      - "5432"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
